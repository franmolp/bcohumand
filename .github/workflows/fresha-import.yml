name: Importar citas y horarios (BCO Turnos)

on:
  schedule:
    # Todos los días a las 00:15 UTC = 21:15 ART — 15 min después de Loyverse
    - cron: '15 0 * * *'
  workflow_dispatch:
    inputs:
      from:
        description: 'Fecha inicio (YYYY-MM-DD). Vacío = 1° del mes actual'
        required: false
      to:
        description: 'Fecha fin (YYYY-MM-DD). Vacío = fin del mes siguiente'
        required: false

jobs:
  import:
    name: Descargar e importar reportes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Fresha quedó apagado: las citas por empleada y los horarios del equipo (turnos programados) salen de BCO Turnos.
      - name: Importar citas desde BCO Turnos
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
        run: |
          Q=""
          if [ -n "$FROM" ] && [ -n "$TO" ]; then Q="?desde=$FROM&hasta=$TO"; fi
          R=$(curl -sS -m 90 -w '\n%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/importar/citas-turnos$Q")
          echo "$R"
          echo "::notice::$(echo "$R" | head -1)"
          [ "$(echo "$R" | tail -1)" = "200" ]

      - name: Importar horarios del equipo desde BCO Turnos
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          R=$(curl -sS -m 90 -w '\n%{http_code}' -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/importar/horarios-turnos")
          echo "$R"
          echo "::notice::$(echo "$R" | head -1)"
          [ "$(echo "$R" | tail -1)" = "200" ]
